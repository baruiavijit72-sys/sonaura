# Sonaura — GitHub Actions Build Pipeline
# =============================================
# 
# 🔥 HOW TO USE FROM YOUR MOBILE PHONE:
#   1. Open github.com/<your-username>/sonaura in your mobile browser
#   2. Go to the "Actions" tab
#   3. Find this workflow: "🚀 Build Android APK"
#   4. Tap "Run workflow" → confirm
#   5. Wait ~15 minutes for the build
#   6. Scroll to the finished run → tap "Artifacts" → download sonaura-android-apks.zip
#   7. Install the APK on your phone!


name: 🚀 Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile_desktop/**'

concurrency:
  group: build-${ github.ref }
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 💥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧨️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: 📦 Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/mobile_desktop/.dart_tool
            apps/mobile_desktop/build
          key: flutter-${ { runner.os }}-${ { hashFiles('apps/mobile_desktop/pubspec.yaml') }}
          restore-keys: flutter-${ { runner.os }}-

      - name: 📦 Install Dependencies
        working-directory: apps/mobile_desktop
        run: flutter pub get

      - name: 🔑 Create debug keystore
        run: |
          keytool -genkey -v \
            -keystore apps/mobile_desktop/android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, OU=Dev, O=Sonaura, L=World, S=Earth, C=IN"

      - name: 🔑 Create release keystore
        run: |
          keytool -genkey -v \
            -keystore apps/mobile_desktop/android/app/sonaura-release.keystore \
            -alias sonaura \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sonaura \
            -keypass sonaura \
            -dname "CN=Sonaura, OU=Dev, O=Sonaura, L=World, S=Earth, C=IN"

      - name: 📝 Create key.properties
        run: |
          cat > apps/mobile_desktop/android/key.properties << 'EOF'
          storePassword=sonaura
          keyPassword=sonaura
          keyAlias=sonaura
          storeFile=sonaura-release.keystore
          EOF

      - name: 🏣️ Build Release APKs
        working-directory: apps/mobile_desktop
        run: |
          flutter build apk --release --target-platform=android-arm64 || \
            flutter build apk --debug --target-platform=android-arm64
          flutter build apk --release --target-platform=android-arm || \
            flutter build apk --debug --target-platform=android-arm

      - name: 📱 Prepare APKs for Download
        run: |
          cd apps/mobile_desktop/build/app/outputs/flutter-apk
          mkdir -p release-apks
          # Copy release APKs if they exist, otherwise debug APKs
          for apk in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk app-release.apk; do
            if [ -f "$apk" ]; then
              case "$apk" in
                app-arm64-v8a-release.apk) cp "$apk" release-apks/sonaura-arm64-v8a.apk ;;
                app-armeabi-v7a-release.apk) cp "$apk" release-apks/sonaura-armeabi-v7a.apk ;;
                app-x86_64-release.apk) cp "$apk" release-apks/sonaura-x86_64.apk ;;
                app-release.apk) cp "$apk" release-apks/sonaura-universal.apk ;;
              esac
            fi
          done
          # Fallback: copy debug APKs if no release APKs
          if [ -z "$(ls -A release-apks/)" ]; then
            for apk in app-arm64-v8a-debug.apk app-armeabi-v7a-debug.apk; do
              if [ -f "$apk" ]; then
                case "$apk" in
                  app-arm64-v8a-debug.apk) cp "$apk" release-apks/sonaura-arm64-v8a-debug.apk ;;
                  app-armeabi-v7a-debug.apk) cp "$apk" release-apks/sonaura-armeabi-v7a-debug.apk ;;
                esac
              fi
            done
          fi
          echo "✅ APKs prepared:"
          ls -la release-apks/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonaura-android-apks
          path: apps/mobile_desktop/build/app/outputs/flutter-apk/release-apks/
          retention-days: 30
          compression-level: 0

      - name: 📱 Summary
        run: |
          echo "=========================="
          echo "  ✊ BUILD COMPLETE!"
          echo "=========================="
          echo ""
          echo "  📱 Download from Artifacts section above:"
          echo "     Most phones: sonaura-arm64-v8a.apk"
          echo "     Older phones: sonaura-armeabi-v7a.apk"
          echo "     Universal: sonaura-universal.apk"
          echo ""
          echo "  🐐 Admin CMS Login:"
          echo "     Email:    admin@sonaura.dev"
          echo "     Password: SonauraAdmin2024!"
          echo ""
          echo " 🎵 Demo Listener:"
          echo "     Email:    demo@sonaura.dev"
          echo "     Password: DemoUser123!"
          echo "=========================="